services:
  postgres:
    image: postgres:15-alpine
    container_name: serviceflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-serviceflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_NAME:-serviceflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-serviceflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serviceflow_network

  backend:
    build: ./backend
    container_name: serviceflow_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-serviceflow}:${DB_PASSWORD:-secretpassword}@postgres:5432/${DB_NAME:-serviceflow}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost/api}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serviceflow_network

  frontend:
    build: ./frontend
    container_name: serviceflow_frontend
    restart: unless-stopped
    volumes:
      - frontend_build:/dist
    depends_on:
      - backend
    networks:
      - serviceflow_network

  nginx:
    image: nginx:alpine
    container_name: serviceflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - serviceflow_network

volumes:
  postgres_data:
  frontend_build:

networks:
  serviceflow_network:
    driver: bridge